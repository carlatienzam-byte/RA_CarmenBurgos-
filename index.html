<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RA con marcador — Carmen de Burgos</title>

<script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
<script src="aframe-ar.js"></script>

<style>
  .arjs-loader {
    height: 100%; width: 100%; position: absolute; top: 0; left: 0;
    background-color: rgba(0, 0, 0, 0.8); z-index: 9999;
    display: flex; justify-content: center; align-items: center;
  }
  .arjs-loader div { text-align: center; font-size: 1.25em; color: white; font-family: sans-serif; }
</style>
</head>
<body style="margin: 0px; overflow: hidden;">

  <div class="arjs-loader"><div>Cargando…</div></div>

  <a-scene
    vr-mode-ui="enabled: false;"
    renderer="logarithmicDepthBuffer: true; precision: medium;"
    embedded
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">

    <a-marker preset="hiro">
      <a-entity gltf-model="carmen-burgos.glb"
                position="0 0.95 0" scale="0.6 0.6 0.6" rotation="0 0 0">
        <a-animation attribute="rotation" to="0 360 0" dur="8000" easing="linear" repeat="indefinite"></a-animation>
      </a-entity>
      <a-text value="Carmen de Burgos" align="center" position="0 2.2 0"
              color="#ffffff" side="double" scale="1.5 1.5 1.5"></a-text>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    document.querySelector('a-scene').addEventListener('loaded', function () {
      document.querySelector('.arjs-loader').remove();
    });
  </script>

</body>
</html>
